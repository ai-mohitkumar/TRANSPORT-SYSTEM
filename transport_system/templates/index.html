{% extends "base.html" %}
{% block title %}Welcome - KALAWATI TRANSPORT{% endblock %}
{% block content %}
<div class="hero-section text-center py-5">
  <div class="logo-circle mb-4">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="rounded-circle" style="width: 100px; height: 100px;">
  </div>
  <h1 class="display-4 mb-4">KALAWATI TRANSPORT</h1>
  <p class="lead mb-5">Smart Payment & Tracking System</p>
  <div class="row justify-content-center">
    <div class="col-md-4">
      <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg w-100 mb-3">
        <i class="fas fa-sign-in-alt me-2"></i>Login
      </a>
    </div>
    <div class="col-md-4">
      <a href="{{ url_for('register') }}" class="btn btn-outline-primary btn-lg w-100">
        <i class="fas fa-user-plus me-2"></i>Register
      </a>
    </div>
  </div>
</div>
{% endblock %}
